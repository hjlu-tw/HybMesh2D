name: CI

# Three gates:
#   lint   — ruff over the GUI, using tools/PreProcessor/gui/ruff.toml (the same
#            command a developer runs locally).
#   build  — the C++ (HybMesh2D + surface_resampler) compiled with -Werror, then
#            the C++ unit tests via ctest. The CMakeLists deliberately leaves
#            -Werror to CI; this is where it lives. ctest runs HERE and not in the
#            test job because the test job downloads two binaries and has no build
#            tree, so there is no CTestTestfile.cmake for ctest to read — and a
#            failing unit test is a build-gate concern anyway.
#   test   — the headless GUI/model regression suite, run AFTER the C++ build so
#            the tests that need the compiled binaries actually execute instead of
#            self-skipping. Without that, a GUI<->C++ interface change could break
#            the pipeline while CI stayed green.
#
# Every job carries a timeout-minutes. GitHub's default is 360, so one hung test
# would burn six hours of runner time in silence; the suite's own longest wait is
# a 540 s watchdog, and its first successful Linux run took 13 min end to end, so
# 30 leaves room without leaving a hang unbounded.

on:
  push:
    paths:
      - "tools/PreProcessor/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "config/pipeline/**"
      - ".github/workflows/gui-tests.yml"
  pull_request:
    paths:
      - "tools/PreProcessor/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "config/pipeline/**"
      - ".github/workflows/gui-tests.yml"
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      # Run from the GUI directory so ruff.toml applies, exactly as documented in
      # that file. The tests directory is linted with the same config.
      - name: Lint the GUI
        working-directory: tools/PreProcessor/gui
        run: ruff check .
      - name: Lint the test suite
        working-directory: tools/PreProcessor/gui
        run: ruff check --config ruff.toml ../tests
      # The CLI entry points live outside the GUI package, so `ruff check .` above
      # does not reach them; they are real code and get the same gate.
      - name: Lint the CLI entry points
        working-directory: tools/PreProcessor/gui
        run: ruff check --config ruff.toml ../run_pipeline.py ../run_batch.py

  build:
    name: Build C++ (-Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The Gmsh SDK (gmsh.h + libgmsh) comes from the pip wheel; CMakeLists finds
      # it under the pip prefix. Pinned to the version the C++ links against.
      # libgmsh.so is the full build and links against GLU, which a bare runner
      # does not have: without this the link fails on gluCylinder / gluSphere /
      # gluLookAt and friends. The macOS dylib has no such dependency, so this
      # only ever shows up here. The test job needs the same library at RUN time.
      - name: Install the system libraries libgmsh links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa libgl1

      - name: Install the Gmsh SDK
        run: |
          python -m pip install --upgrade pip
          pip install "gmsh>=4.15,<4.16"
      - name: Configure + build with warnings as errors
        run: ./build.sh Release -DCMAKE_CXX_FLAGS=-Werror

      # The C++ unit tests. Built by default (HYBMESH_BUILD_TESTS=ON), so the
      # build step above already produced them and -Werror covered the test TUs
      # too. The loader path comes from the repo's own helper rather than a
      # hardcoded pip prefix: hybmesh_core's tests link libgmsh, and the baked
      # rpath is only reliably right on the machine that did the build (see the
      # note in tools/scripts/gmsh_lib_dir.sh). The decision-layer tests link no
      # dylib at all and would pass without this.
      - name: Run the C++ unit tests
        run: |
          . tools/scripts/gmsh_lib_dir.sh
          hybmesh_export_gmsh_lib_path
          cd build && ctest --output-on-failure

      # upload-artifact and download-artifact are a PAIR and are bumped
      # together: v7 uploads gained `archive: false` (a single file, unzipped)
      # and v8 downloads stopped unconditionally unzipping to match. We upload a
      # two-file artifact, so it is zipped by default and v8 unzips it — but
      # bumping only one side is how that agreement breaks silently.
      - name: Upload the binaries for the test job
        uses: actions/upload-artifact@v7
        with:
          name: hybmesh-binaries
          path: |
            build/HybMesh2D
            build/surface_resampler
          retention-days: 1

  test:
    name: Headless regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # System libraries PyQt6 needs even under the offscreen platform.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 \
            libglu1-mesa

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/PreProcessor/gui/requirements.txt

      # Reuse the -Werror build so the binary-dependent tests run for real.
      # v8 makes a digest mismatch a hard ERROR rather than a warning; that
      # default is kept deliberately — a binary that arrived corrupted must not
      # go on to be tested, and the tests it runs are the whole point of the job.
      - name: Download the built binaries
        uses: actions/download-artifact@v8
        with:
          name: hybmesh-binaries
          path: build
      - name: Make them executable
        run: chmod +x build/HybMesh2D build/surface_resampler

      - name: Run the headless regression suite
        env:
          QT_QPA_PLATFORM: offscreen
          # Surface the best-effort diagnostics too, so a CI failure carries the
          # full picture in results/logs/gui.log.
          HYBMESH_LOG_LEVEL: DEBUG
        run: bash tools/PreProcessor/tests/run_all.sh

      # An end-to-end mesh run is the real GUI->C++ contract check: the GUI's
      # config writer feeds the mesher for real, not through a mock.
      - name: End-to-end pipeline (mesh stage only)
        run: ./run_pipeline.sh config/pipeline/naca_demo.json --no-solver

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-logs
          path: results/logs/
          retention-days: 7
