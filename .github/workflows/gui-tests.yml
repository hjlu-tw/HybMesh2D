name: GUI regression tests

# Runs the headless PreProcessor GUI/model regression suite. The tests select
# the offscreen Qt platform and self-skip the parts that need the compiled C++
# binaries, so no build step is required here.

on:
  push:
    paths:
      - "tools/PreProcessor/**"
      - ".github/workflows/gui-tests.yml"
  pull_request:
    paths:
      - "tools/PreProcessor/**"
      - ".github/workflows/gui-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # System libraries PyQt6 needs even under the offscreen platform.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/PreProcessor/gui/requirements.txt

      - name: Run headless GUI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash tools/PreProcessor/tests/run_all.sh
